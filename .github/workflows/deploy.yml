name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd $GITHUB_WORKSPACE
          git pull origin main

      - name: Rebuild and restart containers
        run: |
          cd $GITHUB_WORKSPACE
          docker compose build --pull
          docker compose up -d
