services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tap-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ~/.ssh:/root/.ssh:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: tap-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
